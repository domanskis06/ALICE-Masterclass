apiVersion: v1
kind: List
items:
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: alice-masterclass
      namespace: alice-web-masterclass-dev
      labels:
        app: alice-masterclass
    spec:
      host: alice-web-masterclass-dev.app.cern.ch
      to:
        kind: Service
        name: alice-masterclass
        weight: 100
      port:
        targetPort: 8080-tcp
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      wildcardPolicy: None
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: alice-masterclass-django
      namespace: alice-web-masterclass-dev
      labels:
        app: alice-masterclass-django
    spec:
      host: api-alice-web-masterclass-dev.app.cern.ch
      to:
        kind: Service
        name: alice-masterclass-django
        weight: 100
      port:
        targetPort: 8000-tcp
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      wildcardPolicy: None
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: alice-masterclass-teacher
      namespace: alice-web-masterclass-dev
      labels:
        app: alice-masterclass-teacher
    spec:
      host: teacher-alice-web-masterclass-dev.app.cern.ch
      to:
        kind: Service
        name: alice-masterclass-teacher
        weight: 100
      port:
        targetPort: 8080-tcp
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      wildcardPolicy: None
