apiVersion: v1
kind: List
items:
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: alice-masterclass-demo
      namespace: alice-web-masterclass-demo
      labels:
        app: alice-masterclass-demo
    spec:
      host: alice-web-masterclass-demo.app.cern.ch
      to:
        kind: Service
        name: alice-masterclass-demo
        weight: 100
      port:
        targetPort: 8080-tcp
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      wildcardPolicy: None