convert_strangeness_events:
  stage: convert
  image: rootproject/root:6.22.08-ubuntu20.04
  before_script:
    - cd "$CI_PROJECT_DIR/alice-masterclass-js"
  script:
    # Clean VA hosts from AliVSD ROOT (gitignore'd under src/assets/.../part1/).
    - root -b -q "./data/strangeness/part1/convert_events.C(\"./data/strangeness/part1/events\", \"./src/assets/exercises/strangeness/part1\")"
    # Ξ / Ξ̅ helices from FemtoUniverse dump, then merge into host events (seed map).
    - python3 ./data/strangeness/part1_Xi/convert_xi_params.py
    - python3 ./data/strangeness/part1_Xi/merge_cascades_into_hosts.py --cascades ./data/strangeness/part1_Xi/_out/xi_cascades.json
  artifacts:
    paths:
      - alice-masterclass-js/src/assets/exercises/strangeness/part1

convert_strangeness_invariant:
  stage: convert
  image: python:3.6.13-alpine3.13
  before_script:
    - cd "$CI_PROJECT_DIR/alice-masterclass-js"
  script:
    - python3 ./data/strangeness/part2/convert.py ./data/strangeness/part2/ ./src/assets/exercises/strangeness/part2
  artifacts:
    paths:
      - alice-masterclass-js/src/assets/exercises/strangeness/part2

.convert_strangeness_invariant_hints:
  stage: convert
  when: manual
  image: rootproject/root:6.22.08-ubuntu20.04
  before_script:
    - cd "$CI_PROJECT_DIR/alice-masterclass-js"
  script:
    - root -b -q "./data/strangeness/part2/generate_hints.C(\"./data/strangeness/part2/InvariantMass.root\", \"./src/assets/exercises/strangeness/part2\")"
  artifacts:
    paths:
      - alice-masterclass-js/src/assets/exercises/strangeness/part2

unit_tests_js:
  stage: test
  needs:
  - job: convert_strangeness_events
    artifacts: true
  - job: convert_strangeness_invariant
    artifacts: true
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  before_script:
    - cd "$CI_PROJECT_DIR/alice-masterclass-js"
    - npm install -g npm@11
  script:
    - 'echo "CI_COMMIT_SHA=$CI_COMMIT_SHA CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"'
    # Fail fast if muon-arm GLBs are missing from the checkout (Karma serves src/assets).
    - |
      set -e
      MODEL_DIR="src/assets/models/alice components"
      ls -la "$MODEL_DIR"
      for f in MCH.glb ABSO.glb DIPO.glb BP.glb; do
        test -f "$MODEL_DIR/$f" || { echo "MISSING detector GLB: $MODEL_DIR/$f"; exit 1; }
      done
    - npm ci
    - export CHROME_BIN="$(ls /ms-playwright/chromium-*/chrome-linux*/chrome 2>/dev/null | head -1)"
    - '[ -n "$CHROME_BIN" ] || export CHROME_BIN="$(ls /ms-playwright/chromium_headless_shell-*/chrome-linux*/headless_shell 2>/dev/null | head -1)"'
    - 'echo "Using CHROME_BIN=$CHROME_BIN"'
    - npm run build
    - npm run test:ci

e2e_playwright:
  stage: test
  allow_failure: true
  needs:
    - job: convert_strangeness_events
      artifacts: true
    - job: convert_strangeness_invariant
      artifacts: true
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  variables:
    CI: "true"
  before_script:
    - cd "$CI_PROJECT_DIR/alice-masterclass-js"
    - npm install -g @angular/cli@21.0.0
    - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip
    - python3 -m venv .venv-e2e-django
    - . .venv-e2e-django/bin/activate && pip install -r ../alice-masterclass-django/requirements.txt
    - (cd ../alice-masterclass-teacher && npm ci)
  script:
    - |
      . .venv-e2e-django/bin/activate
      export E2E_PYTHON="$(command -v python)"
      npm ci
      npm run e2e:django
      npm run e2e:teacher
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - alice-masterclass-js/playwright-report/
      - alice-masterclass-js/playwright-report-django/
      - alice-masterclass-js/playwright-report-teacher/
      - alice-masterclass-js/test-results/
      - alice-masterclass-js/test-results-django/
      - alice-masterclass-js/test-results-teacher/

build_website_js:
  stage: build_website
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*-dev$/
  needs:
    - job: convert_strangeness_events
      artifacts: true
    - job: convert_strangeness_invariant
      artifacts: true
    - job: unit_tests_js
      artifacts: false
  image: node:22-bookworm
  before_script:
    - cd "$CI_PROJECT_DIR/alice-masterclass-js"
    - npm install -g npm@11
  script:
    - npm ci
    - export VERSION=$CI_COMMIT_TAG
    - node -p "let data = require('./package.json'); data.version='$VERSION'; JSON.stringify(data, null, 2)" > package_version.json
    - mv package_version.json package.json
    - npm run build:prod
    - cp .htaccess ./dist/
  artifacts:
    paths:
      - alice-masterclass-js/dist/

build_docker_js:
  stage: dockerize
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*-dev$/
  needs:
    - job: build_website_js
      artifacts: true
    - job: unit_tests_js
      artifacts: false
  tags:
    - docker-privileged-xl
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
      DOCKER_DRIVER: overlay2
      CONTAINER_VERSION_IMAGE: $CI_REGISTRY_IMAGE/alice-masterclass:$CI_COMMIT_TAG
      CONTAINER_LATEST_IMAGE: $CI_REGISTRY_IMAGE/alice-masterclass:latest
  before_script:
   - for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break || (echo "waiting for docker daemon ($i/30)"; sleep 2); done
   - docker info
   - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
   - docker build --pull -f alice-masterclass-js/Dockerfile -t $CONTAINER_VERSION_IMAGE alice-masterclass-js
   - docker push $CONTAINER_VERSION_IMAGE
   - docker tag $CONTAINER_VERSION_IMAGE $CONTAINER_LATEST_IMAGE
   - docker push $CONTAINER_LATEST_IMAGE

redeploy_js:
  stage: openshift_redeploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*-dev$/
  needs:
    - job: build_docker_js
      artifacts: false
  image: gitlab-registry.cern.ch/paas-tools/openshift-client:latest
  environment:
    name: dev
    url: https://alice-web-masterclass-dev.app.cern.ch/
  script:
    - sh ci/redeploy-openshift.sh "$APP_NAME"
  variables:
    SERVER: https://api.paas.okd.cern.ch
    APP_NAME: alice-masterclass

