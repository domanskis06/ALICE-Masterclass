<div class="pid-heatmap" #host [style.height.px]="height">
  <canvas
    #canvas
    class="pid-heatmap__canvas"
    [style.left.px]="margin.left"
    [style.top.px]="margin.top"
    data-testid="jpsi-pid-canvas"
  ></canvas>

  <svg #svg class="pid-heatmap__overlay" [attr.width]="width" [attr.height]="height">
    <g class="x-axis"></g>
    <g class="y-axis"></g>
    <g class="count-axis"></g>

    @if (maxCount > 0) {
      <g class="pid-heatmap__colour-bar">
        @for (band of colourBarBands; track band.y) {
          <rect
            [attr.x]="colourBar.x"
            [attr.y]="band.y"
            [attr.width]="colourBar.width"
            [attr.height]="band.height"
            [attr.fill]="band.colour"
          ></rect>
        }
        <rect
          class="pid-heatmap__colour-bar-frame"
          [attr.x]="colourBar.x"
          [attr.y]="colourBar.y"
          [attr.width]="colourBar.width"
          [attr.height]="colourBar.height"
        ></rect>
      </g>
    }

    @if (cutRect; as rect) {
      <rect
        class="pid-heatmap__cut"
        [attr.x]="rect.x"
        [attr.y]="rect.y"
        [attr.width]="rect.width"
        [attr.height]="rect.height"
      ></rect>
    }

    <text
      class="pid-heatmap__axis-label"
      [attr.x]="margin.left + plotWidth / 2"
      [attr.y]="height - 8"
      text-anchor="middle"
    >
      {{ 'JPSI.PID.X_AXIS' | translate }}
    </text>
    <text
      class="pid-heatmap__axis-label"
      [attr.transform]="'rotate(-90) translate(' + -(margin.top + plotHeight / 2) + ', 18)'"
      text-anchor="middle"
    >
      {{ 'JPSI.PID.Y_AXIS' | translate }}
    </text>
  </svg>

  @if (maxCount === 0) {
    <p class="pid-heatmap__empty">{{ 'JPSI.PID.EMPTY' | translate }}</p>
  }
</div>
