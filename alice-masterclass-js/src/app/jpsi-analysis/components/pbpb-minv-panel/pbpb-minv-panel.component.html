<mat-card appearance="outlined" class="pbpb-minv-panel" id="jpsi-tour-pbpb-minv-panel">
  <mat-card-title class="pbpb-minv-panel__title">
    {{ 'JPSI.PBPB.MINV.TITLE' | translate }}
  </mat-card-title>

  <mat-card-content>
    <div class="pbpb-minv-panel__legend" id="jpsi-tour-pbpb-series-toggles">
      <button
        mat-stroked-button
        class="pbpb-minv-panel__toggle"
        [class.pbpb-minv-panel__toggle--off]="!visibility.unlike"
        [style.--series-colour]="colours.unlike"
        data-testid="jpsi-pbpb-toggle-unlike"
        (click)="onToggle('unlike')"
      >
        <span class="pbpb-minv-panel__swatch"></span>
        {{ 'JPSI.PBPB.MINV.UNLIKE' | translate }}
      </button>

      <button
        mat-stroked-button
        class="pbpb-minv-panel__toggle"
        [class.pbpb-minv-panel__toggle--off]="!visibility.like"
        [style.--series-colour]="colours.posPos"
        data-testid="jpsi-pbpb-toggle-like"
        (click)="onToggle('like')"
      >
        <span class="pbpb-minv-panel__swatch"></span>
        {{ 'JPSI.PBPB.MINV.LIKE' | translate }}
      </button>
    </div>

    <div class="pbpb-minv-panel__chart" #host [style.height.px]="height">
      @if (loading) {
        <div class="pbpb-minv-panel__spinner" fxLayout="column" fxLayoutAlign="center center">
          <mat-spinner></mat-spinner>
        </div>
      }
      <svg #svg [attr.width]="width" [attr.height]="height">
        @for (entry of series; track entry.key) {
          <g class="pbpb-minv-panel__series" [attr.data-series]="entry.key">
            @for (bar of entry.bars; track $index) {
              <rect
                [attr.x]="bar.x"
                [attr.y]="bar.y"
                [attr.width]="bar.width"
                [attr.height]="bar.height"
                [attr.fill]="entry.colour"
              ></rect>
            }
          </g>
        }

        <g class="x-axis"></g>
        <g class="y-axis"></g>

        <text
          class="pbpb-minv-panel__axis-label"
          [attr.x]="margin.left + plotWidth / 2"
          [attr.y]="height - 6"
          text-anchor="middle"
        >
          {{ 'JPSI.MASS.X_AXIS' | translate }}
        </text>
        <text
          class="pbpb-minv-panel__axis-label"
          [attr.transform]="'rotate(-90) translate(' + -(margin.top + plotHeight / 2) + ', 14)'"
          text-anchor="middle"
        >
          {{ 'JPSI.MASS.Y_AXIS' | translate }}
        </text>
      </svg>

      @if (!loading && histogram === null) {
        <p class="pbpb-minv-panel__notice">{{ 'JPSI.PBPB.MINV.EMPTY' | translate }}</p>
      }
    </div>
  </mat-card-content>

  <mat-card-actions class="pbpb-minv-panel__actions">
    <button
      mat-raised-button
      color="primary"
      id="jpsi-tour-pbpb-subtract-button"
      data-testid="jpsi-pbpb-subtract"
      [disabled]="!canSubtract"
      (click)="onSubtractClick()"
    >
      {{ 'JPSI.PBPB.MINV.SUBTRACT' | translate }}
    </button>
    @if (mode === 'subtracted') {
      <span class="pbpb-minv-panel__hint">{{ 'JPSI.PBPB.MINV.AFTER_SUBTRACT' | translate }}</span>
    }
  </mat-card-actions>
</mat-card>
