unit_tests_django:
  stage: test
  image: python:3.12-slim-bookworm
  before_script:
    - cd "$CI_PROJECT_DIR/alice-masterclass-django"
    - pip install --no-cache-dir -r requirements.txt
  script:
    - export PYTHONUNBUFFERED=1
    - export DJANGO_LOCAL=1
    - python3 manage.py makemigrations
    - python3 manage.py migrate
    - python3 manage.py test

build_docker_django:
  stage: dockerize
  only:
   - tags
  except:
   - branches
  tags:
    - docker-privileged-xl
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
      DOCKER_DRIVER: overlay2
      CONTAINER_VERSION_IMAGE: $CI_REGISTRY_IMAGE/alice-masterclass-django:$CI_COMMIT_TAG
      CONTAINER_LATEST_IMAGE: $CI_REGISTRY_IMAGE/alice-masterclass-django:latest
  before_script:
   - for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break || (echo "waiting for docker daemon ($i/30)"; sleep 2); done
   - docker info
   - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
   - docker build --pull -f alice-masterclass-django/Dockerfile -t $CONTAINER_VERSION_IMAGE alice-masterclass-django
   - docker push $CONTAINER_VERSION_IMAGE
   - docker tag $CONTAINER_VERSION_IMAGE $CONTAINER_LATEST_IMAGE
   - docker push $CONTAINER_LATEST_IMAGE

redeploy_django:
  stage: openshift_redeploy
  only:
    - tags
  except:
    - branches
  needs:
    - job: build_docker_django
      artifacts: false
  image: gitlab-registry.cern.ch/paas-tools/openshift-client:latest
  environment:
    name: dev
    url: https://alice-web-masterclass-dev.app.cern.ch/
  script:
   - "oc import-image $APP_NAME --all --server=$SERVER --namespace $NAMESPACE --token=$IMAGE_IMPORT_TOKEN"
   - "sleep 30s && oc rollout status dc/$APP_NAME --server=$SERVER --namespace $NAMESPACE --token=$IMAGE_IMPORT_TOKEN"
  variables:
    SERVER: https://api.paas.okd.cern.ch
    APP_NAME: alice-masterclass-django
