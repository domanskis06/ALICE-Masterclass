<div fxFill fxLayout="row">
  <figure fxFlex="grow" fxLayout="column">
    <div id="title" class="no-interaction"><ng-content select="[title]"></ng-content></div>
    <svg
      #svg
      attr.viewBox="0 0 {{SVG.W}} {{SVG.H}}"
      [attr.preserveAspectRatio]="stretchToFit ? 'none' : 'xMidYMid meet'"
    >
      <!-- Counts stays at the top of OY (teacher VA convention). -->
      <g id="yAxisLabel" attr.transform="translate({{MARGIN.LEFT_YLABEL}}, {{MARGIN.TOP}}) rotate(-90)" text-anchor="end">
        <ng-content select="[yAxisLabel]"></ng-content>
      </g>
      <g id="contentArea" attr.transform="translate({{CONTENT_AREA.X}}, {{CONTENT_AREA.Y}})">
        <defs>
          <clipPath id="clip">
            <rect x="0" y="0" attr.width="{{CONTENT_AREA.W}}" attr.height="{{CONTENT_AREA.H}}"></rect>
          </clipPath>
        </defs>
        <g id="yAxis" #yAxis></g>
        <g id="mainArea" clip-path="url(#clip)">
          <g id="bars" #bars></g>
          <g id="brush" #brush></g>
        </g>
        <!-- After bars so mirrored tick marks stay visible above the plot. -->
        <g id="xAxis" #xAxis attr.transform="translate(0, {{CONTENT_AREA.H}})"></g>
      </g>
      <g id="xAxisLabel" attr.transform="translate({{CONTENT_AREA.X + CONTENT_AREA.W}}, {{xAxisLabelY}})" text-anchor="end">
        <ng-content select="[xAxisLabel]"></ng-content>
      </g>
    </svg>
  </figure>
</div>
