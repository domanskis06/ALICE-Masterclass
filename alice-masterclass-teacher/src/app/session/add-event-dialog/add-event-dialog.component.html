<mat-dialog-content>
  <form [formGroup]="form">
    <div>
      <mat-form-field appearance="fill">
        <mat-label>{{ 'SESSION.ADD_EVENT_DIALOG.EVENT_NAME' | translate }}</mat-label>
        <input matInput type="text" [formControl]="$any(form.controls.name)" required>
        @if (form.controls.name.value !== '') {
          <mat-error>{{ 'SESSION.ADD_EVENT_DIALOG.NAME_EXISTS' | translate }}</mat-error>
        }
      </mat-form-field>
    </div>
    <div>
      <mat-form-field appearance="fill">
        <mat-label>{{ 'SESSION.ADD_EVENT_DIALOG.KIND' | translate }}</mat-label>
        <mat-select [formControl]="$any(form.controls.kind)" required>
          @for (kind of kinds; track kind.value) {
            <mat-option [value]="kind.value">{{ kind.labelKey | translate }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <app-spinner-container [loading]="loading">
    <button mat-raised-button color="primary" [disabled]="loading || form.invalid" (click)="onCreateButtonClicked()">{{ 'SESSION.ADD_EVENT_DIALOG.CREATE' | translate }}</button>
  </app-spinner-container>
  <button mat-raised-button mat-dialog-close tabindex="-1">{{ 'SESSION.ADD_EVENT_DIALOG.CANCEL' | translate }}</button>
</mat-dialog-actions>
