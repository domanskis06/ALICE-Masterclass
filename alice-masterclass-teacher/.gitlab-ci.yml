unit_tests_teacher:
  stage: test
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  before_script:
    - cd "$CI_PROJECT_DIR/alice-masterclass-teacher"
    - npm install -g npm@11
  script:
    - npm ci
    - export CHROME_BIN="$(ls /ms-playwright/chromium-*/chrome-linux*/chrome 2>/dev/null | head -1)"
    - '[ -n "$CHROME_BIN" ] || export CHROME_BIN="$(ls /ms-playwright/chromium_headless_shell-*/chrome-linux*/headless_shell 2>/dev/null | head -1)"'
    - 'echo "Using CHROME_BIN=$CHROME_BIN"'
    - npm run build
    - npm run test:ci

build_website_teacher:
  stage: build_website
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*-dev$/
  needs:
    - job: unit_tests_teacher
      artifacts: false
  image: node:22-bookworm
  before_script:
    - cd "$CI_PROJECT_DIR/alice-masterclass-teacher"
    - npm install -g npm@11
  script:
    - npm ci
    - export VERSION=$CI_COMMIT_TAG
    - node -p "let data = require('./package.json'); data.version='$VERSION'; JSON.stringify(data, null, 2)" > package_version.json
    - mv package_version.json package.json
    - npm run build
    - cp .htaccess ./dist/browser/
  artifacts:
    paths:
      - alice-masterclass-teacher/dist/

build_docker_teacher:
  stage: dockerize
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*-dev$/
  needs:
    - job: build_website_teacher
      artifacts: true
    - job: unit_tests_teacher
      artifacts: false
  tags:
    - docker-privileged-xl
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
      DOCKER_DRIVER: overlay2
      CONTAINER_VERSION_IMAGE: $CI_REGISTRY_IMAGE/alice-masterclass-teacher:$CI_COMMIT_TAG
      CONTAINER_LATEST_IMAGE: $CI_REGISTRY_IMAGE/alice-masterclass-teacher:latest
  before_script:
   - for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break || (echo "waiting for docker daemon ($i/30)"; sleep 2); done
   - docker info
   - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
   - docker build --pull -f alice-masterclass-teacher/Dockerfile -t $CONTAINER_VERSION_IMAGE alice-masterclass-teacher
   - docker push $CONTAINER_VERSION_IMAGE
   - docker tag $CONTAINER_VERSION_IMAGE $CONTAINER_LATEST_IMAGE
   - docker push $CONTAINER_LATEST_IMAGE

redeploy_teacher:
  stage: openshift_redeploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*-dev$/
  needs:
    - job: build_docker_teacher
      artifacts: false
  image: gitlab-registry.cern.ch/paas-tools/openshift-client:latest
  environment:
    name: dev
    url: https://alice-web-masterclass-dev.app.cern.ch/
  script:
    - sh ci/redeploy-openshift.sh "$APP_NAME"
  variables:
    SERVER: https://api.paas.okd.cern.ch
    APP_NAME: alice-masterclass-teacher
